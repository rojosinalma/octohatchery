name: Runner smoke test
run-name: "Runner smoke test on ${{ inputs.runner_type }}"

# Manual only. Proves that an OctoHatchery runner of the chosen type picks up a job,
# has the expected tools and can reach the buildkitd sidecar.
on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: Runner type label
        type: choice
        default: generic
        options:
          - generic
          - deploy

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: [self-hosted, "${{ inputs.runner_type }}"]
    timeout-minutes: 10
    steps:
      - name: Who am I
        run: |
          echo "runner: $RUNNER_NAME on $(hostname)"
          echo "tool cache: $RUNNER_TOOL_CACHE"
          gh --version | head -1
          docker --version
          docker buildx version
          git lfs version

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reach buildkitd
        run: |
          if [ -z "${BUILDKIT_HOST:-}" ]; then echo "BUILDKIT_HOST not set on this runner type"; exit 0; fi
          docker buildx create --name smoke --driver remote "$BUILDKIT_HOST" --use
          docker buildx inspect --bootstrap | head -8
          printf 'FROM scratch\nCOPY . /src\n' > Dockerfile.smoke
          docker buildx build -f Dockerfile.smoke --output type=cacheonly .

      - name: Reach the deploy target
        if: inputs.runner_type == 'deploy'
        run: |
          : "${DEPLOYER_URL:?deploy runners need DEPLOYER_URL}"
          : "${DEPLOYER_TOKEN:?deploy runners need DEPLOYER_TOKEN}"
          ca=(); [ -n "${DEPLOYER_CA:-}" ] && ca=(--cacert "$DEPLOYER_CA")
          code=$(curl -sS -o /dev/null -w '%{http_code}' "${ca[@]}" -H "Authorization: Bearer $DEPLOYER_TOKEN" "$DEPLOYER_URL/api/services")
          echo "deployer answered $code"
          [ "$code" != 401 ] && [ "$code" != 000 ]
