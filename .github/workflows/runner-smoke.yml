name: Runner smoke test
run-name: "Runner smoke test on ${{ inputs.runner_type }}"

# Manual only. Proves that an OctoHatchery runner of the chosen type picks up a job,
# has the expected tools and can reach the buildkitd sidecar.
on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: Runner type label
        type: choice
        default: generic
        options:
          - generic
          - deploy
          - generic-docker-in-docker

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: [self-hosted, "${{ inputs.runner_type }}"]
    timeout-minutes: 10
    steps:
      - name: Who am I
        run: |
          echo "runner: $RUNNER_NAME on $(hostname)"
          echo "tool cache: $RUNNER_TOOL_CACHE"
          gh --version | head -1
          docker --version
          docker buildx version
          git lfs version

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image bakes Ruby 3.3.12 and 3.4.11 into the tool cache and Bun 1.4.3 into ~/.bun.
      # The setup actions must use them: a download rewrites the .complete marker or the bun binary.
      - name: Note the baked tools
        run: |
          ls "$RUNNER_TOOL_CACHE/Ruby"
          stat -c '%n %y %i' "$RUNNER_TOOL_CACHE"/Ruby/*/*.complete "$HOME/.bun/bin/bun" | tee "$RUNNER_TEMP/baked-tools"

      - name: Set up Ruby 3.3
        id: ruby33
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.3"

      - name: Ruby 3.3 is the baked 3.3.12
        env:
          PREFIX: ${{ steps.ruby33.outputs.ruby-prefix }}
        run: |
          ruby -v
          case "$PREFIX" in
            "$RUNNER_TOOL_CACHE"/Ruby/3.3.12/*) ;;
            *) echo "::error::setup-ruby chose $PREFIX; bump RUBY_VERSIONS in runner/tools/ruby/Dockerfile"; exit 1 ;;
          esac

      - name: Set up Ruby 3.4
        id: ruby34
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.4"

      - name: Ruby 3.4 is the baked 3.4.11
        env:
          PREFIX: ${{ steps.ruby34.outputs.ruby-prefix }}
        run: |
          ruby -v
          case "$PREFIX" in
            "$RUNNER_TOOL_CACHE"/Ruby/3.4.11/*) ;;
            *) echo "::error::setup-ruby chose $PREFIX; bump RUBY_VERSIONS in runner/tools/ruby/Dockerfile"; exit 1 ;;
          esac

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Nothing was downloaded
        run: |
          bun --version
          [ "$(bun --version)" = 1.4.3 ]
          stat -c '%n %y %i' "$RUNNER_TOOL_CACHE"/Ruby/*/*.complete "$HOME/.bun/bin/bun" | diff "$RUNNER_TEMP/baked-tools" - \
            || { echo "::error::a setup action downloaded a tool the image should provide"; exit 1; }

      - name: Reach buildkitd
        run: |
          if [ -z "${BUILDKIT_HOST:-}" ]; then echo "BUILDKIT_HOST not set on this runner type"; exit 0; fi
          docker buildx create --name smoke --driver remote "$BUILDKIT_HOST" --use
          docker buildx inspect --bootstrap | head -8
          printf 'FROM scratch\nCOPY . /src\n' > Dockerfile.smoke
          docker buildx build -f Dockerfile.smoke --output type=cacheonly .

      # Docker-in-Docker: the daemon is another container; the work folder is one volume shared by both.
      - name: Work folder is shared with the daemon
        if: startsWith(env.DOCKER_HOST, 'tcp://')
        run: |
          case "$RUNNER_TEMP" in /home/runner/_work/*) ;; *) echo "::error::RUNNER_TEMP=$RUNNER_TEMP is not under the shared work folder"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/t" && echo host > "$RUNNER_TEMP/t/in"
          out=$(docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/t:/w" alpine:3.22 sh -c 'cat /w/in && echo container > /w/out')
          [ "$out" = host ] || { echo "::error::the container read '$out' instead of 'host'"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/t/out")" = container ] || { echo "::error::the container's file did not reach the job"; exit 1; }
          rm -rf "$RUNNER_TEMP/t"
          echo "shared in both directions"

      - name: Reach the deploy target
        if: inputs.runner_type == 'deploy'
        run: |
          : "${DEPLOYER_URL:?deploy runners need DEPLOYER_URL}"
          : "${DEPLOYER_TOKEN:?deploy runners need DEPLOYER_TOKEN}"
          ca=(); [ -n "${DEPLOYER_CA:-}" ] && ca=(--cacert "$DEPLOYER_CA")
          code=$(curl -sS -o /dev/null -w '%{http_code}' "${ca[@]}" -H "Authorization: Bearer $DEPLOYER_TOKEN" "$DEPLOYER_URL/api/services")
          echo "deployer answered $code"
          [ "$code" != 401 ] && [ "$code" != 000 ]
