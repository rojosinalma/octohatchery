name: octohatchery

services:
  octohatchery:
    build:
      context: .
      target: dev
    container_name: octohatchery
    restart: unless-stopped
    # The app reads /app/.env itself (Bun loads dotenv); no env_file here so secrets never land in the compose config.
    volumes:
      - type: bind
        source: ${PROJECT_DIR:-.}
        target: /app
        bind:
          create_host_path: false
      - type: volume
        source: node_modules
        target: /app/node_modules
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    # The image runs as an unprivileged user; this grants it the host's docker socket group.
    # DOCKER_GID = `stat -c %g /var/run/docker.sock` on this host.
    group_add:
      - "${DOCKER_GID:-999}"
    mem_limit: ${APP_MEM:-1g}
    cpus: 1
    depends_on:
      - buildkitd
    networks:
      - default
      # Operators without a reverse-proxy network delete `ingress` here and below.
      - ingress
      # Remove the next line (and the `postgres` network below) when the database is not on this network.
      - postgres

  buildkitd:
    image: moby/buildkit:v0.34.0
    container_name: octohatchery-buildkitd
    restart: unless-stopped
    privileged: true
    command: ["--addr", "tcp://0.0.0.0:1234"]
    volumes:
      - type: volume
        source: buildkit
        target: /var/lib/buildkit
    mem_limit: ${BUILDKIT_MEM:-2g}
    cpus: ${BUILDKIT_CPUS:-2}
    networks:
      - default

volumes:
  node_modules:
  buildkit:

networks:
  # Your reverse proxy's network (set INGRESS_NETWORK in .env). Standalone: delete it and add a `ports:` block to the app.
  ingress:
    external: true
    name: ${INGRESS_NETWORK:-ingress}
  default:
    # Runners join this network so `octohatchery-buildkitd` resolves; RUNNER_NETWORK must match its name.
    name: octohatchery_default
  # Shared Postgres lives on an external network. Operators without one delete this block and the `- postgres` line above.
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:-postgres}
